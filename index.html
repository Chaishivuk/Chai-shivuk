<head>
<meta charset="UTF-8">

<style>
:root{
  --ink:#14213D; --bg:#F6F7F9; --card:#FFFFFF; --line:#E5E8EE;
  --green:#16A34A; --green-dark:#128A3E; --amber:#D97706; --red:#DC2626;
  --muted:#6B7280;
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Assistant',sans-serif; background:var(--bg); color:var(--ink); font-size:16px}
h1,h2,h3,.logo{font-family:'Rubik',sans-serif}
button{font-family:inherit; cursor:pointer; border:none; background:none; font-size:inherit}
input,select,textarea{font-family:inherit; font-size:16px}
img{display:block; max-width:100%}

/* Header */
header{position:sticky; top:0; z-index:40; background:var(--ink); color:#fff; padding:10px 14px; box-shadow:0 2px 10px rgba(20,33,61,.25)}
.hrow{display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:1100px; margin:0 auto}
.logo{font-size:24px; font-weight:800; letter-spacing:-.5px; white-space:nowrap}
.logo b{color:#4ADE80}
.searchwrap{flex:1; max-width:520px; position:relative}
.searchwrap input{width:100%; border:none; border-radius:99px; padding:9px 40px 9px 14px; background:#fff; color:var(--ink)}
.searchwrap svg{position:absolute; top:50%; right:13px; transform:translateY(-50%); width:17px; height:17px; stroke:var(--muted)}
.vat{background:#1E2E52; color:#C6D3F0; text-align:center; font-size:12.5px; padding:4px; line-height:1.5}

.hcol{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
.hlogo{width:52px; height:52px; flex:0 0 auto; background:#fff; border-radius:13px; padding:3px; object-fit:contain}
.bsd{font-size:11px;color:#AEB9D6;font-weight:600;line-height:1;margin-bottom:2px}
.hcol .searchwrap{max-width:none;width:100%}
/* Category chips */
.chips{display:flex; gap:8px; overflow-x:auto; padding:12px 14px; max-width:1100px; margin:0 auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; background:var(--card); border:1.5px solid var(--line); border-radius:99px; padding:7px 15px; font-weight:600; font-size:14px; color:var(--ink); transition:.15s}
.chip.on{background:var(--ink); border-color:var(--ink); color:#fff}
.catstrip{display:flex; gap:10px; overflow-x:auto; padding:12px 14px 6px; max-width:1100px; margin:0 auto; scrollbar-width:none}
.catstrip::-webkit-scrollbar{display:none}
.catbtn{flex:0 0 auto; width:98px; background:none; display:flex; flex-direction:column; align-items:center; gap:5px}
.catring{width:86px; height:86px; border-radius:50%; padding:2px; background:#fff; border:2.5px solid #22C55E; display:flex; align-items:center; justify-content:center; overflow:hidden; transition:.15s}
.catring .catimg{width:100%; height:100%; border:0; border-radius:50%}
.cathome{font-size:32px}
.catlbl{font-size:12.5px; font-weight:600; color:var(--muted); line-height:1.25; text-align:center; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.catbtn.on .catring{border-color:var(--ink); box-shadow:0 0 0 3px rgba(20,33,61,.12)}
.catbtn.on .catlbl{color:var(--ink); font-weight:800}

main{max-width:1100px; margin:0 auto; padding:0 14px 110px}
.sect{margin-top:18px}
.secthead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.secthead h2{font-size:19px; font-weight:700}
.secthead .tag{font-size:12px; font-weight:700; border-radius:6px; padding:2px 8px; color:#fff}
.tag.sale{background:var(--amber)} .tag.new{background:var(--green)}

/* Product grid */
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.rail{display:flex; gap:10px; overflow-x:auto; overflow-y:hidden; padding-bottom:8px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
.rail>.pcard{flex:0 0 40%; scroll-snap-align:center}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-track{background:#EEF2F8; border-radius:99px}
.rail::-webkit-scrollbar-thumb{background:#C7D0E0; border-radius:99px}
@media(min-width:640px){.rail>.pcard{flex:0 0 27%}}
@media(min-width:900px){.rail>.pcard{flex:0 0 21%}}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.pcard{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; position:relative}
.pimg{aspect-ratio:1; background:#fff; display:flex; align-items:center; justify-content:center; padding:10px}
.pimg img{max-height:100%; object-fit:contain}
.pimg .noimg{color:#C3C9D4; font-size:13px}
.pbody{padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1}
.pname{font-weight:700; font-size:14.5px; line-height:1.25; min-height:2.4em}
.psku{color:var(--muted); font-size:12px}
.prices{display:flex; align-items:baseline; gap:7px; margin-top:2px}
.pprice{font-family:'Rubik'; font-weight:700; font-size:17px}
.pold{color:var(--muted); text-decoration:line-through; font-size:13px}
.ptier{font-size:12px; color:var(--green-dark); font-weight:600; background:#EAF7EF; border-radius:6px; padding:2px 7px; width:fit-content}
.addbtn{margin-top:auto; background:var(--green); color:#fff; font-weight:700; border-radius:9px; padding:9px; transition:.15s}
.addbtn:active{transform:scale(.97)}
.addbtn.inc{background:#EAF7EF; color:var(--green-dark); display:flex; align-items:center; justify-content:space-between; padding:5px 8px}
.addbtn.inc b{font-size:17px; padding:2px 12px}
.badge{position:absolute; top:8px; right:8px; z-index:2; font-size:11.5px; font-weight:700; color:#fff; border-radius:6px; padding:3px 8px}
.badge.sale{background:var(--amber)} .badge.new{background:var(--green)}
.oos .pimg{filter:grayscale(1); opacity:.55}
.oosband{position:absolute; top:42%; left:0; right:0; background:rgba(220,38,38,.92); color:#fff; text-align:center; font-weight:700; padding:5px; font-size:13.5px; z-index:2}
.oosbtn{margin-top:auto; background:#F1F2F5; color:#9AA1AE; font-weight:700; border-radius:9px; padding:9px; cursor:not-allowed}

/* Cart bar & drawer */
.cartbar{position:fixed; bottom:0; left:0; right:0; z-index:50; background:var(--ink); color:#fff; padding:11px 16px; display:none; align-items:center; justify-content:space-between; gap:12px; box-shadow:0 -3px 14px rgba(0,0,0,.18)}
.cartbar.show{display:flex}
.cartbar .sum{font-family:'Rubik'; font-weight:700; font-size:17px}
.cartbar button{background:var(--green); color:#fff; font-weight:700; border-radius:99px; padding:10px 22px}
.overlay{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:60; display:none}
.overlay.show{display:block}
.drawer{position:fixed; bottom:0; left:0; right:0; z-index:70; background:#fff; border-radius:18px 18px 0 0; max-height:82vh; display:flex; flex-direction:column; transform:translateY(105%); transition:.25s}
.drawer.show{transform:none}
.brandside{display:flex; align-items:center; gap:11px}
.menubtn{display:flex; flex-direction:column; justify-content:center; gap:4.5px; width:38px; height:38px; padding:0 8px; background:rgba(255,255,255,.12); border-radius:10px}
.menubtn span{display:block; height:2.5px; background:#fff; border-radius:99px}
.menubtn:active{background:rgba(255,255,255,.22)}
.sidemenu{position:fixed; top:0; right:0; bottom:0; width:78%; max-width:320px; background:#fff; z-index:70; transform:translateX(105%); transition:.25s; display:flex; flex-direction:column; box-shadow:-6px 0 24px rgba(15,23,42,.18)}
.sidemenu.show{transform:none}
.smhead{display:flex; align-items:center; justify-content:space-between; padding:16px; background:var(--ink); color:#fff}
.smhead h3{font-size:19px}
.smhead button{color:#fff; font-size:22px; background:none}
.smlist{overflow-y:auto; padding:8px}
.smrow{display:flex; align-items:center; gap:10px; width:100%; text-align:right; background:none; padding:13px 12px; border-radius:11px; font-size:15.5px; font-weight:600; color:var(--ink); border-bottom:1px solid var(--line)}
.smrow:last-child{border-bottom:0}
.smrow b{font-size:12.5px; color:var(--muted); background:#EEF2F8; border-radius:99px; padding:2px 9px; font-weight:700}
.smrow.on{background:var(--ink); color:#fff}
.smrow.on b{background:rgba(255,255,255,.18); color:#fff}
.smname{flex:1; text-align:right}
.catimg{width:42px; height:42px; flex:0 0 auto; border-radius:50%; object-fit:cover; background:#fff; border:2px solid #22C55E}
.catimg.home{display:flex; align-items:center; justify-content:center; font-size:19px; border:2px solid var(--line)}
.dhead{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
.dhead h3{font-size:18px}
.dlist{overflow-y:auto; padding:6px 16px; flex:1}
.drow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
.drow img{width:52px; height:52px; object-fit:contain; border:1px solid var(--line); border-radius:9px; background:#fff}
.dinfo{flex:1; min-width:0}
.dinfo .n{font-weight:700; font-size:14px}
.dinfo .s{color:var(--muted); font-size:12px}
.qty{display:flex; align-items:center; gap:2px; background:#F1F2F5; border-radius:99px}
.qty button{width:30px; height:30px; font-size:17px; font-weight:700; color:var(--ink)}
.qty b{min-width:22px; text-align:center; font-size:14px}
.dsum{padding:13px 16px; border-top:1px solid var(--line)}
.dsum .row{display:flex; justify-content:space-between; font-weight:700; font-size:17px; margin-bottom:10px}
.wabtn{width:100%; display:flex; align-items:center; justify-content:center; gap:9px; background:var(--green); color:#fff; font-weight:700; font-size:16.5px; border-radius:12px; padding:13px}
.wabtn svg{width:21px; height:21px; fill:#fff}
.mailbtn{width:100%; margin-top:9px; background:#fff; color:var(--ink); border:1.5px solid var(--line); font-weight:700; font-size:15.5px; border-radius:12px; padding:11px}

footer{background:var(--ink); color:#B9C4DC; text-align:center; padding:26px 16px 34px; margin-top:36px; font-size:14px}
footer .big{color:#fff; font-weight:700; font-size:16px; margin-bottom:5px}
.empty{text-align:center; color:var(--muted); padding:44px 0; font-size:15px}

/* Admin */
.adminbar{background:var(--amber); color:#fff; text-align:center; font-weight:700; padding:7px; font-size:14px}
.awrap{max-width:1100px; margin:0 auto; padding:16px 14px 60px}
.abtns{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.abtn{background:var(--ink); color:#fff; font-weight:700; border-radius:9px; padding:10px 16px; font-size:14.5px}
.abtn.g{background:var(--green)}
.agroup{font-size:12.5px;font-weight:700;color:var(--muted);margin:4px 0 8px} .abtn.o{background:#fff; color:var(--ink); border:1.5px solid var(--line)}
.atable{width:100%; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.arow{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.arow img{width:44px; height:44px; object-fit:contain; border:1px solid var(--line); border-radius:8px}
.ainfo{flex:1; min-width:0}
.ainfo .n{font-weight:700; font-size:14px}
.ainfo .m{color:var(--muted); font-size:12px}
.aact{display:flex; gap:6px}
.aact button{font-size:13px; font-weight:700; border-radius:7px; padding:6px 11px}
.ed{background:#EAF0FB; color:#1D4ED8} .dl{background:#FDECEC; color:var(--red)}
.oostag{font-size:11px; font-weight:700; color:var(--red); background:#FDECEC; border-radius:5px; padding:2px 6px}
.modal{position:fixed; inset:0; z-index:80; background:rgba(15,23,42,.55); display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:20px 12px}
.modal.show{display:flex}
.mbox{background:#fff; border-radius:16px; width:100%; max-width:480px; padding:20px}
.mbox h3{margin-bottom:14px; font-size:18px}
.fld{margin-bottom:12px}
.fld label{display:block; font-weight:700; font-size:13.5px; margin-bottom:5px}
.fld input,.fld select{width:100%; border:1.5px solid var(--line); border-radius:9px; padding:9px 12px; background:#fff}
.fld .hint{font-size:12px; color:var(--muted); margin-top:3px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.chk{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14.5px; margin-bottom:9px}
.chk input{width:18px; height:18px}
.mact{display:flex; gap:8px; margin-top:16px}
.mact .save{flex:1; background:var(--green); color:#fff; font-weight:700; border-radius:10px; padding:12px}
.mact .cancel{background:#F1F2F5; color:var(--ink); font-weight:700; border-radius:10px; padding:12px 18px}
.imgprev{width:84px; height:84px; object-fit:contain; border:1.5px dashed var(--line); border-radius:10px; margin-top:6px; background:#fff}
.loginbox{max-width:340px; margin:80px auto; background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px; text-align:center}
.loginbox h2{margin-bottom:14px}
.loginbox input{width:100%; border:1.5px solid var(--line); border-radius:9px; padding:11px; text-align:center; font-size:18px; letter-spacing:3px}
.loginbox button{width:100%; margin-top:12px; background:var(--ink); color:#fff; font-weight:700; border-radius:10px; padding:12px}
.err{color:var(--red); font-size:13.5px; margin-top:8px; font-weight:600}
.toast{position:fixed; bottom:86px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-weight:600; border-radius:99px; padding:9px 20px; z-index:90; font-size:14px; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap}
.toast.show{opacity:1}

.sortbar{align-items:center; gap:7px}
.disclaim{margin-top:10px; font-size:12px; color:#8E9BB5}
.totopbtn{display:block; width:100%; margin:6px 0 18px; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:13px; font-size:15px; font-weight:700; color:var(--ink)}
.totopbtn:active{background:#F3F6FB}
.pptop{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:14px 0 4px}
.pptop .backbtn{margin:0}
.sharebtn{background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:7px 13px; font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap}
.sharebtn:active{background:#F3F6FB}
.vatnote{font-size:11px; color:var(--muted); margin:1px 0 3px; font-weight:600}
.ppcolors{margin-top:12px}
.ppcolors .cl{font-size:13px; color:var(--muted); font-weight:700; margin-bottom:6px}
.colrow{display:flex; flex-wrap:wrap; gap:7px}
.colchip{border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:7px 13px; font-size:14px; font-weight:600; color:var(--ink)}
.colchip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.colchip.off{opacity:.45; text-decoration:line-through}
.dcol{font-size:12px; color:var(--muted); font-weight:600}
.crow{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line)}
.crow:last-child{border-bottom:0}
.crow .cn{flex:1}
.logrow.clickable{cursor:pointer}
.qbar{background:#EAF0FB; color:#1D4ED8; font-size:12.5px; font-weight:700; border-radius:9px; padding:7px 11px; margin-bottom:12px}
.logrow.clickable:active{background:#F3F6FB}
.sortlbl{font-size:13px; color:var(--muted); font-weight:600; padding-inline-end:2px}
.logbox{max-height:46vh; overflow:auto; border:1px solid var(--line); border-radius:10px; margin-bottom:12px}
.logrow{display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px}
.logrow:last-child{border-bottom:0}
.logrow .lact{flex:0 0 auto; font-weight:700; border-radius:6px; padding:2px 7px; font-size:11.5px}
.lact.add{background:#DCFCE7; color:#166534}
.lact.edit{background:#FEF3C7; color:#92400E}
.lact.del{background:#FEE2E2; color:#991B1B}
.logrow .lname{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.logrow .ltime{flex:0 0 auto; color:var(--muted); font-size:11.5px; direction:ltr}
.logrow .ledit{flex:0 0 auto; color:var(--muted); font-size:13px}
/* Print catalog */
#printcat{display:none}
@media print{
  body *{visibility:hidden}
  #printcat, #printcat *{visibility:visible}
  #printcat{display:block; position:absolute; top:0; left:0; right:0}
  .pc-head{text-align:center; padding:18px 0 8px; border-bottom:3px solid #14213D; margin-bottom:14px}
  .pc-head h1{font-size:30px}
  .pc-head p{color:#555; font-size:13px}
  .pc-cat{font-size:19px; font-weight:700; margin:16px 0 8px; border-right:5px solid #16A34A; padding-right:9px; page-break-after:avoid}
  .pc-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
  .pc-card{border:1px solid #ddd; border-radius:9px; padding:8px; text-align:center; page-break-inside:avoid}
  .pc-card img{height:88px; object-fit:contain; margin:0 auto 5px}
  .pc-card .n{font-weight:700; font-size:12.5px}
  .pc-card .s{color:#777; font-size:10.5px}
  .pc-card .p{font-weight:700; font-size:14px; margin-top:2px}
}
/* Product page */
.backbtn{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:7px 16px;font-weight:700;margin:14px 0 4px}
.pp{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px}
.ppmainwrap{background:#fff;display:flex;align-items:center;justify-content:center;padding:16px;min-height:230px}
.ppmainwrap img{max-height:300px;object-fit:contain}
.ppthumbs{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto}
.ppthumbs img{width:58px;height:58px;object-fit:contain;border:2px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.ppthumbs img.on{border-color:var(--green)}
.ppbody{padding:16px;border-top:1px solid var(--line)}
.ppbody h1{font-size:21px;margin-bottom:4px}
.ppdesc{margin-top:12px;font-size:15px;line-height:1.65;color:#333;white-space:pre-line;border-top:1px solid var(--line);padding-top:12px}
.ppadd{margin-top:14px}
.ppadd .addbtn{width:100%;padding:12px;font-size:16px}
/* Category manager */
.catrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.catrow input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.catrow .dl:disabled{opacity:.35;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>

<script>

    Object.entries(o || {}).forEach(([k, v]) => { const q = parseInt(v, 10); if(q > 0) clean[k] = q; });
    return clean;
  }catch(e){ return {}; }
}

}

function ghToken(){ try{ return localStorage.getItem("gh-token") || ""; }catch(e){ return ""; } }
function setGhToken(t){ try{ localStorage.setItem("gh-token", t.trim()); }catch(e){} }
function ghHeaders(){ return {"Authorization": "Bearer " + ghToken(), "Accept": "application/vnd.github+json"}; }

let dbSha = null;   /* גרסת data.json שנטענה – לזיהוי שינוי חיצוני */
async function loadDB(){
  try{
    if(ghToken()){
      /* מנהל: קוראים ישירות מ-GitHub כדי לא לקבל גרסה ישנה מהמטמון */
      const r = await fetch(GH_API + "data.json?t=" + Date.now(), {headers: ghHeaders(), cache: "no-store"});
      if(r.ok){
        const j = await r.json();
        dbSha = j.sha;
        DB = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, "")), c => c.charCodeAt(0))));
        DB.settings = DB.settings || {};
        return;
      }
    }
    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    if(!r.ok) throw new Error(r.status);
    DB = await r.json();
    DB.settings = DB.settings || {};
  }catch(e){
    document.getElementById("app").innerHTML =
      '<div class="empty">שגיאה בטעינת הקטלוג – בדוק חיבור לאינטרנט ורענן את הדף</div>';
    throw e;
  }
}
async function ghGetSha(path){
  const r = await fetch(GH_API + path + "?t=" + Date.now(), {headers: ghHeaders(), cache: "no-store"});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error("get " + r.status);
  return (await r.json()).sha;
}
async function ghPut(path, b64, msg){
  let lastErr = null;
  for(let attempt = 0; attempt < 4; attempt++){
    try{
      const sha = await ghGetSha(path);
      const body = {message: msg, content: b64, branch: "main"};
      if(sha) body.sha = sha;
      const r = await fetch(GH_API + path, {method: "PUT", headers: ghHeaders(), body: JSON.stringify(body)});
      if(r.ok) return (await r.json()).content.sha;
      /* 409/422 = מישהו/משהו כתב באותו רגע; ננסה שוב עם sha טרי */
      if(r.status === 409 || r.status === 422){ lastErr = new Error("put " + r.status); await sleep(700 * (attempt + 1)); continue; }
      throw new Error("put " + r.status);
    }catch(e){
      lastErr = e;
      await sleep(700 * (attempt + 1));
    }
  }
  throw lastErr || new Error("put failed");
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function b64Unicode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
async function saveDB(){
  if(!ghToken()){ toast("חסר מפתח גישה – התחבר מחדש לניהול"); return false; }
  toast("שומר...");
  try{
    for(const [path, b64] of Object.entries(pendingImgs)){
      await ghPut(path, b64, "עדכון תמונה");
    }
    pendingImgs = {};
    await mergeRemote();
    dbSha = await ghPut("data.json", b64Unicode(JSON.stringify(DB)), "עדכון קטלוג");
    toast("נשמר! השינוי יופיע לכולם תוך כדקה");
    return true;
  }catch(e){
    toast("השמירה נכשלה – בדוק חיבור לאינטרנט ונסה שוב");
    return false;
  }
}
/* אם הקובץ בשרת השתנה מאז שנטען (מכשיר אחר / כרטיסייה אחרת) –
   מוסיפים משם את מה שחסר לנו, כדי ששמירה לא תמחק מוצרים חדשים */
async function mergeRemote(){
  try{
    const r = await fetch(GH_API + "data.json?t=" + Date.now(), {headers: ghHeaders(), cache: "no-store"});
    if(!r.ok) return;
    const j = await r.json();
    if(!dbSha || j.sha === dbSha) return;
    const remote = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, "")), c => c.charCodeAt(0))));
    const mine = new Set(DB.products.map(p => p.id));
    const added = (remote.products || []).filter(p => !mine.has(p.id));
    if(added.length){
      DB.products = DB.products.concat(added);
      toast(`שולבו ${added.length} מוצרים שנוספו במקביל`);
    }
    const cats = new Set(DB.categories.map(c => c.id));
    (remote.categories || []).forEach(c => { if(!cats.has(c.id)) DB.categories.push(c); });
  }catch(e){ /* אם המיזוג נכשל – ממשיכים לשמור כרגיל */ }
}

function effPrice(p, qty){
  let base = (p.sale != null) ? p.sale : p.price;
  if(p.tier && qty >= p.tier.qty) base = Math.min(base, p.tier.price);
  return base;
}
/* מק"ט לפי קטגוריה: קטגוריה ראשונה 1001+, שנייה 2001+ וכן הלאה */
function newSku(cat){
  const used = new Set(DB.products.map(p => p.sku));
  const i = DB.categories.findIndex(c => c.id === cat);
  const base = (i < 0 ? DB.categories.length : i + 1) * 1000;
  for(let n = base + 1; n < base + 1000; n++){
    const s = String(n);
    if(!used.has(s)) return s;
  }
  let s;
  do{ s = String(Math.floor(1000 + Math.random()*99000)); } while(used.has(s));
  return s;
}

function savedOrder(kind){
  return (DB.settings && DB.settings.order && DB.settings.order[kind]) || [];
}
function orderList(kind, list){
  const ord = savedOrder(kind);
  if(!ord.length) return list;
  const idx = id => { const i = ord.indexOf(id); return i < 0 ? 1e9 : i; };
  return list.slice().sort((a, b) => idx(a.id) - idx(b.id));
}
function setOrder(kind, ids){
  DB.settings = DB.settings || {};
  DB.settings.order = DB.settings.order || {};
  DB.settings.order[kind] = ids;
}
function groupList(kind){
  return orderList(kind, DB.products.filter(kind === "sale" ? (p => p.sale != null) : (p => p.isNew)));
}

function basePrice(p){ return (p.sale != null) ? p.sale : p.price; }
function sortList(ps){

  if(view.sort === "desc") return ps.slice().sort((a,b) => basePrice(b) - basePrice(a));

function recentAdded(limit){
  const log = Array.isArray(DB.log) ? DB.log : [];
  const out = [], seen = {};
  for(const e of log){
    if(e.act !== "add" || seen[e.id]) continue;
    const p = DB.products.find(x => x.id === e.id);
    if(!p) continue;
    seen[e.id] = 1; out.push(p);
    if(out.length >= (limit || 40)) break;
  }
  return out;
}
function logAct(act, p){
  DB.log = Array.isArray(DB.log) ? DB.log : [];
  DB.log.unshift({t: new Date().toISOString(), act, id: p.id, name: p.name, cat: p.cat, price: p.price});
  if(DB.log.length > 300) DB.log.length = 300;
}

  return m ? decodeURIComponent(m[1]) : null;

async function shareProduct(p){
  const url = productUrl(p);
  const priceTxt = (p.sale != null ? nis(p.sale) : nis(p.price));
  const text = `${p.name}\nמק"ט ${p.sku} · ${priceTxt}\n${url}`;
  if(navigator.share){
    try{ await navigator.share({title: p.name, text: text}); return; }catch(e){ if(e && e.name === "AbortError") return; }
  }
  try{
    await navigator.clipboard.writeText(text);
    toast("הקישור הועתק – אפשר להדביק בוואטסאפ");
  }catch(e){
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");

function section(title, tag, products, rail){
  const tg = tag ? `<span class="tag ${tag}">${tag==="sale"?"מבצע":"חדש"}</span>` : "";
  return `<div class="sect">
    <div class="secthead"><h2>${esc(title)}</h2>${tg}</div>
    <div class="${rail ? "rail" : "grid"}">${products.map(card).join("")}</div>
  </div>`;
}

function card(p){
  const qty = pidQty(p.id);
  const img = p.img ? `<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">` : `<span class="noimg">ללא תמונה</span>`;
  const badge = p.sale != null ? `<span class="badge sale">מבצע</span>` : (p.isNew ? `<span class="badge new">חדש</span>` : "");
  const prices = (p.sale != null && p.sale !== p.price)
    ? `<span class="pprice">${nis(p.sale)}</span><span class="pold">${nis(p.price)}</span>`
    : `<span class="pprice">${nis(basePrice(p))}</span>`;
  const tier = p.tier ? `<span class="ptier">מעל ${p.tier.qty} יח' – ${nis(p.tier.price)} ליח'</span>` : "";
  if(!p.stock){
    return `<div class="pcard oos">
      ${badge}<div class="oosband">אזל במלאי</div>
      <div class="pimg" data-open="${p.id}">${img}</div>
      <div class="pbody">
        <div class="pname">${esc(p.name)}</div>
        <div class="psku">מק"ט ${p.sku}</div>
        <div class="prices">${prices}</div>
        ${vatNote(p)}
        <button class="oosbtn" disabled>לא זמין</button>
      </div>
    </div>`;
  }
  const btn = qty === 0
    ? `<button class="addbtn" data-add="${p.id}">הוסף לסל</button>`
    : `<div class="addbtn inc"><button data-add="${p.id}" style="font-size:19px;font-weight:800;padding:2px 12px">+</button><b>${qty}</b><button data-sub="${p.id}" style="font-size:19px;font-weight:800;padding:2px 12px">−</button></div>`;
  return `<div class="pcard">
    ${badge}
    <div class="pimg" data-open="${p.id}">${img}</div>
    <div class="pbody">
      <div class="pname" data-open="${p.id}">${esc(p.name)}</div>
      <div class="psku">מק"ט ${p.sku}</div>
      <div class="prices">${prices}</div>
      ${vatNote(p)}
      ${tier}
      ${btn}
    </div>
  </div>`;
}

/* ---------- cart ---------- */
function ckey(pid, color){ return color ? pid + "::" + color : pid; }
function kpid(k){ const i = k.indexOf("::"); return i < 0 ? k : k.slice(0, i); }
function kcol(k){ const i = k.indexOf("::"); return i < 0 ? null : k.slice(i + 2); }
function pidKeys(pid){ return Object.keys(cart).filter(k => kpid(k) === pid); }
function pidQty(pid){ return pidKeys(pid).reduce((t, k) => t + cart[k], 0); }
function bump(k, d){
  cart[k] = Math.max(0, (cart[k] || 0) + d);
  if(!cart[k]) delete cart[k];
}
/* grid +/- : act on the single existing line when there is exactly one */
function bumpProduct(pid, d){
  const ks = pidKeys(pid);
  if(ks.length === 1){ bump(ks[0], d); return; }
  if(d < 0 && ks.length && !cart[pid]) { bump(ks[ks.length - 1], d); return; }
  bump(pid, d);
}
function cartItems(){
  return Object.entries(cart).map(([k, qty]) => {
    const p = DB.products.find(x => x.id === kpid(k));
    return p ? {p, qty, color: kcol(k), key: k} : null;
  }).filter(Boolean);
}
function cartTotal(){
  return cartItems().reduce((t, {p, qty}) => t + effPrice(p, qty) * qty, 0);
}
function updateCartUI(){
  saveCart();
  const items = cartItems();
  const n = items.reduce((t, i) => t + i.qty, 0);
  const bar = $("#cartbar");
  if(!bar) return;
  if(n === 0){ bar.classList.remove("show"); closeCart(); return; }
  bar.classList.add("show");
  $("#cbcount").textContent = n + " פריטים";
  $("#cbsum").textContent = nis(cartTotal());
}
function openCart(){
  const list = $("#dlist");
  list.innerHTML = cartItems().map(({p, qty, color, key}) => `
    <div class="drow">
      ${p.img ? `<img src="${p.img}">` : `<div style="width:52px;height:52px;border:1px solid var(--line);border-radius:9px"></div>`}
      <div class="dinfo">
        <div class="n">${esc(p.name)}${color ? ` <span class="dcol">צבע: ${esc(color)}</span>` : ""}</div>
        <div class="s">מק"ט ${p.sku} · ${nis(effPrice(p, qty))} ליח'</div>
      </div>
      <div class="qty">
        <button data-cadd="${esc(key)}">+</button><b>${qty}</b><button data-csub="${esc(key)}">−</button>
      </div>
    </div>`).join("");
  $("#dtotal").textContent = nis(cartTotal());
  list.querySelectorAll("[data-cadd]").forEach(b => b.onclick = () => { bump(b.dataset.cadd, 1); openCart(); updateCartUI(); });
  list.querySelectorAll("[data-csub]").forEach(b => b.onclick = () => {
    bump(b.dataset.csub, -1);
    if(!Object.keys(cart).length){ closeCart(); render(); return; }
    openCart(); updateCartUI();
  });
  $("#overlay").classList.add("show");
  $("#drawer").classList.add("show");
}
function closeCart(){
  const o = $("#overlay"), d = $("#drawer");
  if(o) o.classList.remove("show");
  if(d) d.classList.remove("show");
}
function orderLines(){
  const items = cartItems();
  if(!items.length) return null;
  const n = items.reduce((t, i) => t + i.qty, 0);
  let lines = ["🛒 הזמנה חדשה – חי שיווק", "――――――――――――"];
  items.forEach(({p, qty, color}, i) => {
    lines.push(`${i + 1}. ${p.name}${color ? " – צבע: " + color : ""}`);
    lines.push(`    מק"ט ${p.sku} | ${qty} יח' × ${nis(effPrice(p, qty))} = ${nis(effPrice(p, qty) * qty)}`);
  });
  lines.push("――――――――――――");
  lines.push(`סה"כ פריטים: ${n}`);
  lines.push(`💰 סה"כ לתשלום: ${nis(cartTotal())}`);
  return lines;
}

async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}

  m.classList.add("show");
  $("#q_back").onclick = openSettings;
  $("#q_noprice").onclick = () => startQuick(noPriceList());
  $("#q_recent").onclick  = () => startQuick(recentAdded());
  $("#q_all").onclick     = () => startQuick(DB.products);
  $("#q_start").onclick   = () => {
    const c = $("#q_cat").value;
    if(!c){ toast("בחר קבוצה או קטגוריה"); return; }
    startQuick(DB.products.filter(p => p.cat === c));
  };
}
function startQuick(list){
  if(!list.length){ toast("אין מוצרים בקבוצה הזאת"); return; }
  quick = {ids: list.map(p => p.id), i: 0};
  openEditor(quick.ids[0]);
}
function quickNext(){
  if(!quick) return;
  quick.i++;
  if(quick.i >= quick.ids.length){
    const done = quick.ids.length;
    quick = null;
    $("#modal").classList.remove("show");
    render();
    toast(`סיימת את כל ${done} המוצרים 🎉`);
    return;
  }
  openEditor(quick.ids[quick.i]);
}
function openOrderManager(kind){
  const m = $("#modal");
  const title = kind === "sale" ? "סדר המוצרים במבצע" : "סדר המוצרים החדשים";
  const list = groupList(kind);
  const arrow = (attr, id) => `<button data-${attr}="${id}" style="background:#EAF0FB;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:800;color:#1D4ED8">${attr === "oup" ? "▲" : "▼"}</button>`;
  const rows = list.map((p, i) => `<div class="catrow">
      <span style="display:flex;flex-direction:column;gap:3px">${arrow("oup", p.id)}${arrow("odown", p.id)}</span>
      <span style="font-size:12px;color:var(--muted);min-width:18px">${i + 1}</span>
      ${p.img ? `<img src="${p.img}" style="width:34px;height:34px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:7px">` : ""}
      <span style="flex:1;font-size:13.5px;min-width:0">${esc(p.name)}</span>
      <button class="ed" data-otop="${p.id}" style="font-size:11.5px;padding:3px 9px;white-space:nowrap">לראש</button>
    </div>`).join("");
  m.innerHTML = `<div class="mbox">
    <h3>${title} (${list.length})</h3>
    <div class="hint" style="margin-bottom:8px">הסדר כאן הוא הסדר שהלקוח רואה בעמוד הראשי</div>
    <div style="max-height:46vh;overflow:auto">${rows || '<div class="empty" style="padding:18px">אין מוצרים בקבוצה הזאת</div>'}</div>
    <div class="mact">
      <button class="save" id="ordsave">שמירת הסדר</button>
      <button class="cancel" id="ordback">← חזרה להגדרות</button>
      ${savedOrder(kind).length ? '<button class="cancel" id="ordreset">איפוס לסדר המקורי</button>' : ""}
    </div>
  </div>`;
  m.classList.add("show");
  $("#ordback").onclick = openSettings;
  const move = (id, d) => {
    const ids = groupList(kind).map(p => p.id);
    const i = ids.indexOf(id), j = i + d;
    if(i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    setOrder(kind, ids);
    openOrderManager(kind);
  };
  m.querySelectorAll("[data-oup]").forEach(b => b.onclick = () => move(b.dataset.oup, -1));
  m.querySelectorAll("[data-odown]").forEach(b => b.onclick = () => move(b.dataset.odown, 1));
  m.querySelectorAll("[data-otop]").forEach(b => b.onclick = () => {
    const id = b.dataset.otop;
    const ids = groupList(kind).map(p => p.id).filter(x => x !== id);
    setOrder(kind, [id, ...ids]);
    openOrderManager(kind);
  });
  if($("#ordreset")) $("#ordreset").onclick = async () => {
    if(DB.settings && DB.settings.order) delete DB.settings.order[kind];
    if(await saveDB()){ toast("הסדר אופס"); openOrderManager(kind); }
  };
  $("#ordsave").onclick = async () => {
    setOrder(kind, groupList(kind).map(p => p.id));
    if(await saveDB()){ toast("הסדר נשמר"); m.classList.remove("show"); render(); }
  };
}
function openHistory(){
  const m = $("#modal");
  const log = Array.isArray(DB.log) ? DB.log : [];
  const lbl = {add: "נוסף", edit: "עודכן", del: "נמחק"};
  const rows = log.map(e => {
    const d = new Date(e.t);
    const when = isNaN(d) ? "" : d.toLocaleDateString("he-IL") + " " + d.toLocaleTimeString("he-IL", {hour: "2-digit", minute: "2-digit"});
    const alive = e.act !== "del" && DB.products.some(x => x.id === e.id);
    return `<div class="logrow ${alive ? "clickable" : ""}" ${alive ? `data-hedit="${e.id}"` : ""}>
      <span class="lact ${e.act}">${lbl[e.act] || e.act}</span>
      <span class="lname">${esc(e.name)}${e.cat ? ` · ${esc(catName(e.cat))}` : ""}</span>
      <span class="ltime">${when}</span>
      ${alive ? '<span class="ledit">✎</span>' : ""}
    </div>`;
  }).join("");
  m.innerHTML = `<div class="mbox"><h3>היסטוריית מוצרים (${log.length})</h3>
    <div class="hint" style="margin-bottom:8px">לחיצה על שורה פותחת את המוצר לעריכה</div>
    <div class="logbox">${rows || '<div class="empty" style="padding:18px">אין רשומות עדיין</div>'}</div>
    <div class="mact">
      <button class="cancel" id="hback">← חזרה להגדרות</button>
      ${log.length ? '<button class="cancel" id="hclear" style="color:#991B1B">ניקוי היסטוריה</button>' : ""}
    </div>
  </div>`;
  m.classList.add("show");
  $("#hback").onclick = openSettings;
  m.querySelectorAll("[data-hedit]").forEach(r => r.onclick = () => openEditor(r.dataset.hedit));
  if($("#hclear")) $("#hclear").onclick = async () => {
    if(!confirm("לנקות את כל ההיסטוריה?")) return;
    DB.log = [];
    if(await saveDB()){ toast("ההיסטוריה נוקתה"); openHistory(); }
  };
}

    <div class="two" id="tierwrap" style="display:${p && p.tier ? "grid" : "none"}">
      <div class="fld"><label>מכמות של</label><input id="f_tqty" type="number" inputmode="numeric" value="${p && p.tier ? p.tier.qty : ""}"></div>
      <div class="fld"><label>מחיר ליח' (₪)</label><input id="f_tprice" type="number" inputmode="decimal" value="${p && p.tier ? p.tier.price : ""}"></div>
    </div>

      <div class="chk"><input type="checkbox" id="f_iscolors" ${p && Array.isArray(p.colors) && p.colors.length ? "checked" : ""}><label for="f_iscolors">לדגם זה יש צבעים נוספים</label></div>
      <div class="fld" id="colorswrap" style="display:${p && Array.isArray(p.colors) && p.colors.length ? "block" : "none"}">

          <input id="f_cnew" placeholder="שם צבע – למשל שחור" style="flex:1">
          <button class="abtn" id="f_cadd" style="flex:0 0 auto;padding:8px 14px">+ הוסף</button>
        </div>

      </div>
    </div>
    <div class="fld"><label>תמונה ראשית</label><input id="f_img" type="file" accept="image/*">

    <div class="fld"><label>תמונות נוספות (לעמוד המוצר)</label><input id="f_more" type="file" accept="image/*" multiple>
      <div id="morewrap" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div>
    </div>
    <div class="fld"><label>תיאור מפורט (יופיע בעמוד המוצר)</label>
      <textarea id="f_desc" rows="5" style="width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;font-size:15px">${p && p.desc ? esc(p.desc) : ""}</textarea>
      <div class="hint">מפרט, הסברים, הגדרות – כל שורה חדשה תוצג כשורה נפרדת</div>
    </div>
    <div class="mact">
      <button class="save" id="f_save">${inQuick ? "שמירה והבא ➜" : "שמירה"}</button>
      ${inQuick ? `<button class="cancel" id="f_skip">דלג ➜</button>` : ""}
      <button class="cancel" id="f_cancel">${inQuick ? "יציאה" : "ביטול"}</button>
    </div>
  </div>`;
  m.classList.add("show");
  if(inQuick){

    if(pr){ pr.focus(); pr.select(); }
    $("#f_skip").onclick = () => quickNext();
  }
  let imgData = p ? p.img : null;
  let extraImgs = p && p.imgs ? [...p.imgs] : [];
  function paintMore(){
    $("#morewrap").innerHTML = extraImgs.map((s, i) =>
      `<div style="position:relative"><img src="${s}" style="width:58px;height:58px;object-fit:contain;border:1.5px solid var(--line);border-radius:8px;background:#fff">

    document.querySelectorAll("[data-rmimg]").forEach(b => b.onclick = () => { extraImgs.splice(+b.dataset.rmimg, 1); paintMore(); });
  }
  paintMore();
  $("#f_more").onchange = async e => {
    for(const f of e.target.files){ extraImgs.push(await shrinkImage(f)); }
    e.target.value = ""; paintMore();
  };
  let colors = (p && Array.isArray(p.colors)) ? p.colors.map(c => ({n: c.n, s: c.s !== false})) : [];
  function paintColors(){
    const box = $("#colorslist");
    if(!box) return;
    box.innerHTML = colors.length ? colors.map((c, i) => `
      <div class="crow">
        <span class="cn">${esc(c.n)}</span>
        <label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px">
          <input type="checkbox" data-cstock="${i}" ${c.s ? "checked" : ""}>במלאי

        <button data-crm="${i}" style="background:var(--red);color:#fff;border-radius:7px;padding:3px 9px;font-size:12px">מחיקה</button>
      </div>`).join("") : `<div class="hint">לא הוגדרו צבעים</div>`;
    box.querySelectorAll("[data-cstock]").forEach(cb => cb.onchange = () => { colors[+cb.dataset.cstock].s = cb.checked; });
    box.querySelectorAll("[data-crm]").forEach(b => b.onclick = () => { colors.splice(+b.dataset.crm, 1); paintColors(); });
  }
  paintColors();
  const addColor = () => {
    const inp = $("#f_cnew"), v = inp.value.trim();
    if(!v) return;
    if(colors.some(c => c.n === v)){ toast("הצבע כבר קיים"); return; }
    colors.push({n: v, s: true}); inp.value = ""; paintColors();
  };
  $("#f_cadd").onclick = addColor;
  $("#f_cnew").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); addColor(); } };
  $("#f_iscolors").onchange = e => $("#colorswrap").style.display = e.target.checked ? "block" : "none";
  const fillSubs = () => {
    const subs = catSubs($("#f_cat").value);
    const cur = p ? p.sub : null;
    if(!subs.length){ $("#subfld").style.display = "none"; $("#f_sub").innerHTML = ""; return; }
    $("#subfld").style.display = "block";
    $("#f_sub").innerHTML = `<option value="">ללא</option>` +
      subs.map(s => `<option value="${s.id}" ${cur === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("");
  };
  fillSubs();
  $("#f_cat").onchange = () => {
    fillSubs();
    if(!p) $("#f_sku").value = newSku($("#f_cat").value);
  };
  $("#f_issale").onchange = e => $("#salewrap").style.display = e.target.checked ? "block" : "none";
  $("#f_istier").onchange = e => $("#tierwrap").style.display = e.target.checked ? "grid" : "none";
  $("#f_img").onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    imgData = await shrinkImage(f);
    const pv = $("#f_prev"); pv.src = imgData; pv.style.display = "block";
  };
  $("#f_cancel").onclick = () => { quick = null; m.classList.remove("show"); render(); };
  $("#f_save").onclick = async () => {
    const name = $("#f_name").value.trim();
    const price = parseFloat($("#f_price").value);
    if(!name || !(price > 0)){ toast("חסר שם או מחיר"); return; }
    const obj = {
      id: p ? p.id : "p" + Date.now(),
      name,
      sku: $("#f_sku").value.trim() || newSku($("#f_cat").value),
      cat: $("#f_cat").value,
      price,
      img: imgData,
      stock: $("#f_stock").checked,
      isNew: $("#f_new").checked,
      sale: $("#f_issale").checked ? (parseFloat($("#f_sale").value) || null) : null,
      tier: $("#f_istier").checked ? {
        qty: parseInt($("#f_tqty").value) || 0,
        price: parseFloat($("#f_tprice").value) || 0
      } : null
    };
    if(obj.tier && (!obj.tier.qty || !obj.tier.price)) obj.tier = null;
    if(imgData && imgData.startsWith("data:")){
      const path = "images/" + obj.id + "-" + Date.now() + ".jpg";
      pendingImgs[path] = imgData.split(",")[1];
      obj.img = path;
    } else {
      obj.img = imgData;
    }
    obj.colors = $("#f_iscolors").checked
      ? colors.filter(c => c.n && c.n.trim()).map(c => ({n: c.n.trim(), s: !!c.s}))
      : [];
    obj.sub = ($("#f_sub") && $("#f_sub").value) ? $("#f_sub").value : null;
    obj.desc = $("#f_desc").value.trim();
    obj.imgs = extraImgs.map((s, i) => {
      if(s.startsWith("data:")){
        const path = "images/" + obj.id + "-e" + Date.now() + i + ".jpg";
        pendingImgs[path] = s.split(",")[1];
        return path;
      }
      return s;
    });
    if(p){ DB.products = DB.products.map(x => x.id === p.id ? obj : x); logAct("edit", obj); }
    else { DB.products.push(obj); logAct("add", obj); }
    if(await saveDB()){
      if(inQuick){ toast(`נשמר (${quick.i + 1}/${quick.ids.length})`); quickNext(); }
      else { toast("נשמר"); m.classList.remove("show"); render(); }
    }
  };
}

  };

  });
  document.querySelectorAll("[data-cdel]").forEach(b => b.onclick = () => {
    if(!confirm("למחוק את הקטגוריה?")) return;
    DB.categories = DB.categories.filter(c => c.id !== b.dataset.cdel);
    openCatManager();
  });
  document.querySelectorAll("[data-sadd]").forEach(b => b.onclick = () => {
    const name = prompt("שם תת הקטגוריה:");
    if(!name || !name.trim()) return;
    const c = DB.categories.find(x => x.id === b.dataset.sadd);
    c.subs = c.subs || [];
    c.subs.push({id: "s" + Date.now(), name: name.trim()});
    openCatManager();
  });
  document.querySelectorAll("[data-ssup]").forEach(b => b.onclick = () => {
    saveNames();
    const [cid, sid] = b.dataset.ssup.split(":");
    const c = DB.categories.find(x => x.id === cid);
    const i = c.subs.findIndex(x => x.id === sid);
    if(i > 0){ [c.subs[i-1], c.subs[i]] = [c.subs[i], c.subs[i-1]]; openCatManager(); }
  });
  document.querySelectorAll("[data-ssdown]").forEach(b => b.onclick = () => {
    saveNames();
    const [cid, sid] = b.dataset.ssdown.split(":");
    const c = DB.categories.find(x => x.id === cid);
    const i = c.subs.findIndex(x => x.id === sid);
    if(i >= 0 && i < c.subs.length - 1){ [c.subs[i+1], c.subs[i]] = [c.subs[i], c.subs[i+1]]; openCatManager(); }
  });
  document.querySelectorAll("[data-srename]").forEach(el => el.onclick = () => {
    const [cid, sid] = el.dataset.srename.split(":");
    const c = DB.categories.find(x => x.id === cid);
    const s = (c.subs || []).find(x => x.id === sid);
    const name = prompt("שם חדש לתת הקטגוריה:", s.name);
    if(name && name.trim()){ s.name = name.trim(); openCatManager(); }
  });
  document.querySelectorAll("[data-sdel]").forEach(b => b.onclick = () => {
    const [cid, sid] = b.dataset.sdel.split(":");
    const c = DB.categories.find(x => x.id === cid);
    const n = DB.products.filter(p => p.sub === sid).length;
    if(!confirm(n ? `למחוק? ${n} מוצרים משויכים לתת קטגוריה זו (הם יישארו בקטגוריה הראשית)` : "למחוק את תת הקטגוריה?")) return;
    c.subs = (c.subs || []).filter(x => x.id !== sid);
    DB.products.forEach(p => { if(p.sub === sid) p.sub = null; });
    openCatManager();
  });
  $("#catsave").onclick = async () => {
    document.querySelectorAll("[data-cname]").forEach(inp => {
      const c = DB.categories.find(x => x.id === inp.dataset.cname);
      if(c && inp.value.trim()) c.name = inp.value.trim();
    });
    if(await saveDB()){ m.classList.remove("show"); render(); }
  };
}

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

      const thin = {style: "thin", color: {argb: "FFBFC6D1"}};
      for(const p of ps){
        const price = p.sale != null ? p.sale : p.price;
        const r = ws.addRow(["", p.name + (p.tier ? " (מעל " + p.tier.qty + " יח' – ₪" + p.tier.price + " ליח')" : ""), p.sku, price, "", ""]);
        r.height = 58;

        r.getCell(4).numFmt = '₪#,##0';
        r.getCell(6).value = {formula: "D" + r.number + "*E" + r.number};
        r.getCell(6).numFmt = '₪#,##0';
        r.getCell(5).fill = {type: "pattern", pattern: "solid", fgColor: {argb: "FFFFF3C4"}};
        r.getCell(5).dataValidation = {type: "whole", operator: "between", formulae: [0, 99999], allowBlank: true, showErrorMessage: true, error: "נא להזין מספר שלם"};
        for(let ci = 1; ci <= 6; ci++) r.getCell(ci).border = {top: thin, left: thin, bottom: thin, right: thin};
        dataRows.push(r.number);
        if(p.img){
          try{
            const blob = await (await fetch(p.img)).blob();
            const b64 = await new Promise(rs => {
              const fr = new FileReader();
              fr.onload = () => rs(fr.result.split(",")[1]);
              fr.readAsDataURL(blob);
            });
            const imgId = wb.addImage({base64: b64, extension: "jpeg"});
            ws.addImage(imgId, {tl: {col: 0.06, row: r.number - 1 + 0.04}, ext: {width: 72, height: 66}});
          }catch(e){}
        }
      }
    }
    ws.addRow([]);
    const tot = ws.addRow(["", "", "", "", "סה\"כ לתשלום (כולל מע\"מ):", ""]);
    tot.font = {bold: true, size: 13};
    tot.getCell(6).value = {formula: dataRows.length ? "SUM(" + dataRows.map(n => "F" + n).join(",") + ")" : "0"};
    tot.getCell(6).numFmt = '₪#,##0';
    tot.getCell(6).fill = {type: "pattern", pattern: "solid", fgColor: {argb: "FFDCFCE7"}};
    const out = await wb.xlsx.writeBuffer();
    // fix: some viewers (Google Sheets) read the image size from the shape, which ExcelJS leaves at 0x0
    if(!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip = await JSZip.loadAsync(out);
    const EMU = px => Math.round(px * 9525);
    const dnames = Object.keys(zip.files).filter(nm => /^xl\/drawings\/drawing\d+\.xml$/.test(nm));
    for(const nm of dnames){
      let x = await zip.file(nm).async("string");
      x = x.replace(/<a:off x="0" y="0"\/><a:ext cx="0" cy="0"\/>/g,
        '<a:off x="0" y="0"/><a:ext cx="' + EMU(72) + '" cy="' + EMU(66) + '"/>');
      zip.file(nm, x);
    }
    const blob = await zip.generateAsync({type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "chai-shivuk-order-form.xlsx";
    a.click();
    toast("קובץ ההזמנה ירד");
  }catch(e){
    toast("שגיאה ביצירת הקובץ");
  }
}

function shrinkImage(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const cap = 1000, sc0 = Math.min(1, cap / Math.max(img.width, img.height));
      const c0 = document.createElement("canvas");
      c0.width = Math.max(1, Math.round(img.width * sc0));
      c0.height = Math.max(1, Math.round(img.height * sc0));
      const x0 = c0.getContext("2d");
      x0.fillStyle = "#fff"; x0.fillRect(0, 0, c0.width, c0.height);
      x0.drawImage(img, 0, 0, c0.width, c0.height);
      const d = x0.getImageData(0, 0, c0.width, c0.height).data;
      let minX = c0.width, minY = c0.height, maxX = -1, maxY = -1;
      for(let y = 0; y < c0.height; y++){
        for(let x = 0; x < c0.width; x++){
          const i = (y * c0.width + x) * 4;
          if(d[i] < 244 || d[i+1] < 244 || d[i+2] < 244){
            if(x < minX) minX = x; if(x > maxX) maxX = x;
            if(y < minY) minY = y; if(y > maxY) maxY = y;
          }
        }
      }
      if(maxX < minX || maxY < minY){ minX = 0; minY = 0; maxX = c0.width - 1; maxY = c0.height - 1; }
      const w = maxX - minX + 1, h = maxY - minY + 1;
      const side = Math.max(w, h), pad = Math.round(side * 0.07), box = side + pad * 2;
      const c = document.createElement("canvas"); c.width = c.height = 500;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 500, 500);
      const s = 500 / box;
      ctx.drawImage(c0, minX, minY, w, h,
        Math.round((500 - w * s) / 2), Math.round((500 - h * s) / 2),
        Math.round(w * s), Math.round(h * s));
      res(c.toDataURL("image/jpeg", .8));
    };
    img.src = URL.createObjectURL(file);
  });
}

async function ensureLatest(){
  try{
    const r = await fetch("version.json?t=" + Date.now(), {cache: "no-store"});
    if(!r.ok) return;
    const v = String((await r.json()).v || "");
    if(!v || v === APP_VER) return;
    const key = "chai_ver_reload";
    if(sessionStorage.getItem(key) === v) return;   /* מונע לולאת רענון */
    sessionStorage.setItem(key, v);
    const u = new URL(location.href);
    u.searchParams.set("v", v);
    location.replace(u.toString());
  }catch(e){}
}
