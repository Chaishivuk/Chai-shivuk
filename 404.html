<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>חי שיווק</title>
<meta name="robots" content="noindex">
<script>
/* כתובות וירטואליות של האתר (מוצר / סטורי) – מפנים לכתובת האמיתית */
(function(){
  var p = location.pathname, base = p.replace(/[^\/]*$/, ""), m;
  if((m = p.match(/\/product-([^\/]+)$/))) location.replace(base + "?p=" + m[1]);
  else if(/\/story(-add)?-[^\/]+$/.test(p)) location.replace(base + "?new");
  else location.replace("/Chai-shivuk/");
})();
</script></head><body></body></html>
