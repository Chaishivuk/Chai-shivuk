<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>חי שיווק</title>
<meta name="robots" content="noindex">
<script>
/* כתובות וירטואליות של האתר (מוצר / סטורי) – מפנים לכתובת האמיתית */
(function(){
  /* שורש האתר: בדומיין chaishivuk.co.il זה "/", בכתובת הישנה של GitHub זה "/Chai-shivuk/" */
  var root = /\.github\.io$/.test(location.hostname) ? "/Chai-shivuk/" : "/";
  var p = location.pathname, m;
  if((m = p.match(/\/product-([^\/]+)$/))) location.replace(root + "?p=" + m[1]);
  else if(/\/story(-add)?-[^\/]+$/.test(p)) location.replace(root + "?new");
  else location.replace(root);
})();
</script></head><body></body></html>
